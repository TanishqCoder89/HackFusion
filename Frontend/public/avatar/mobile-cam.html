<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexaHire — Phone Camera</title>
  <!-- Google Fonts Inter & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-app: #f8fafc;
      --bg-surface: #ffffff;
      --border-light: #e2e8f0;
      --border-strong: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --color-primary: #2563eb;
      --color-primary-hover: #1d4ed8;
      --color-primary-tint: #eff6ff;
      --color-primary-border: #bfdbfe;
      --color-success: #16a34a;
      --color-success-tint: #f0fdf4;
      --color-success-border: #bbf7d0;
      --color-warning: #d97706;
      --color-warning-tint: #fffbeb;
      --color-warning-border: #fde68a;
      --color-danger: #dc2626;
      --color-danger-tint: #fef2f2;
      --color-danger-border: #fecaca;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.08), 0 4px 12px rgba(15, 23, 42, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      text-align: center;
      box-shadow: var(--shadow-card);
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .logo i {
      color: var(--color-primary);
    }

    h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    p {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: var(--radius-full);
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .status-badge.connecting {
      color: var(--color-warning);
      border: 1px solid var(--color-warning-border);
      background: var(--color-warning-tint);
    }
    .status-badge.streaming {
      color: var(--color-success);
      border: 1px solid var(--color-success-border);
      background: var(--color-success-tint);
    }
    .status-badge.error {
      color: var(--color-danger);
      border: 1px solid var(--color-danger-border);
      background: var(--color-danger-tint);
    }

    .video-preview-container {
      width: 100%;
      aspect-ratio: 4/3;
      background: #0f172a;
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid var(--border-strong);
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cam-label {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.75);
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .cam-label span {
      width: 6px;
      height: 6px;
      background: var(--color-danger);
      border-radius: 50%;
      display: inline-block;
    }
    .status-badge.streaming ~ .video-preview-container .cam-label span {
      background: #22c55e;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px 18px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      border-radius: var(--radius-md);
      cursor: pointer;
      border: 1px solid var(--color-primary);
      background: var(--color-primary);
      color: #ffffff;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: var(--color-primary-hover);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">
      <i class="fa-solid fa-shield-halved"></i>
      <span>AI Recruiter Proctor</span>
    </div>
    
    <h1>Secondary Mobile Camera</h1>
    <p>Position your smartphone to the side of your desk to record your hands, workspace, and keyboard.</p>
    
    <div class="status-badge connecting" id="status-indicator">
      <i class="fa-solid fa-spinner fa-spin"></i>
      <span>Connecting WebRTC Stream...</span>
    </div>
    
    <div class="video-preview-container">
      <video id="webcam" autoplay muted playsinline></video>
      <div class="cam-label">
        <span></span> LIVE STREAM
      </div>
    </div>
    
    <button class="btn" id="retry-btn" style="display: none;" onclick="window.location.reload();">
      Retry Connection
    </button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session');
    
    const statusIndicator = document.getElementById('status-indicator');
    const webcamVideo = document.getElementById('webcam');
    const retryBtn = document.getElementById('retry-btn');
    
    let localStream = null;
    let peerConnection = null;

    function setStatus(state, text) {
      statusIndicator.className = `status-badge ${state}`;
      let icon = '<i class="fa-solid fa-spinner fa-spin"></i>';
      if (state === 'streaming') {
        icon = '<i class="fa-solid fa-circle-check"></i>';
      } else if (state === 'error') {
        icon = '<i class="fa-solid fa-circle-xmark"></i>';
      }
      statusIndicator.innerHTML = `${icon} <span>${text}</span>`;
    }

    async function startMobileProctor() {
      if (!sessionId) {
        setStatus('error', 'Invalid Session Link');
        return;
      }

      try {
        setStatus('connecting', 'Requesting Camera Access...');
        localStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });
        
        webcamVideo.srcObject = localStream;

        setStatus('connecting', 'Fetching SDP Offer from Desktop...');
        const offerRes = await fetch(`/api/webrtc/offer?sessionId=${sessionId}`);
        if (!offerRes.ok) {
          throw new Error('Desktop session not ready or disconnected. Make sure the desktop lobby is open.');
        }
        const offerData = await offerRes.json();

        setStatus('connecting', 'Connecting WebRTC Peer...');
        let iceServers = [{ urls: 'stun:stun.l.google.com:19302' }];
        try {
          const iceRes = await fetch('/api/ice-config');
          if (iceRes.ok) iceServers = (await iceRes.json()).iceServers || iceServers;
        } catch (e) { console.warn('Using default STUN servers', e); }
        peerConnection = new RTCPeerConnection({ iceServers });

        localStream.getTracks().forEach(track => {
          peerConnection.addTrack(track, localStream);
        });

        await peerConnection.setRemoteDescription(new RTCSessionDescription(offerData.offer));

        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        setStatus('connecting', 'Finalizing ICE Candidates...');
        await new Promise((resolve) => {
          if (peerConnection.iceGatheringState === 'complete') {
            resolve();
          } else {
            const timeout = setTimeout(() => {
              peerConnection.removeEventListener('icegatheringstatechange', checkState);
              resolve();
            }, 3000);

            function checkState() {
              if (peerConnection.iceGatheringState === 'complete') {
                clearTimeout(timeout);
                peerConnection.removeEventListener('icegatheringstatechange', checkState);
                resolve();
              }
            }
            peerConnection.addEventListener('icegatheringstatechange', checkState);
          }
        });

        setStatus('connecting', 'Uploading WebRTC Answer...');
        const answerRes = await fetch('/api/webrtc/answer', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            sessionId: sessionId,
            answer: peerConnection.localDescription
          })
        });

        if (!answerRes.ok) {
          throw new Error('Failed to upload WebRTC answer to signaling channel.');
        }

        peerConnection.addEventListener('connectionstatechange', () => {
          if (peerConnection.connectionState === 'connected') {
            setStatus('streaming', 'Streaming Active');
          } else if (peerConnection.connectionState === 'disconnected' || peerConnection.connectionState === 'failed') {
            setStatus('error', 'Connection Disconnected');
            retryBtn.style.display = 'block';
          }
        });

        setTimeout(() => {
          if (peerConnection && peerConnection.connectionState !== 'failed') {
            setStatus('streaming', 'Streaming Active');
          }
        }, 1500);

      } catch (err) {
        console.error('Mobile WebRTC error:', err);
        setStatus('error', err.message);
        retryBtn.style.display = 'block';
        if (localStream) {
          localStream.getTracks().forEach(t => t.stop());
        }
      }
    }

    window.addEventListener('load', startMobileProctor);
  </script>
</body>
</html>
