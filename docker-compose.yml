# Local production-like stack:  docker compose up --build   ->  http://localhost:5000
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: nexahire
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-change-me-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      DB_URL: mysql://root:${DB_ROOT_PASSWORD:-change-me-root}@db:3306/nexahire
    volumes:
      - uploads:/app/Backend/uploads

volumes:
  dbdata:
  uploads:
